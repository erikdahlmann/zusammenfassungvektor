    <!-- rechtliches --><style>.erik-recht{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:18px 12px 22px;opacity:.75}.erik-recht a{color:inherit}@media print{.erik-recht{display:none}}</style><footer class="erik-recht"><a href="https://erikdahlmann.github.io/impressum.html">Impressum</a> · <a href="https://erikdahlmann.github.io/datenschutz.html">Datenschutz</a></footer><!-- /rechtliches --></nav>

    <script>
        // Globale Hilfsfunktion zum Zeichnen von Vektorpfeilen in Canvas
        function drawVecLabel(ctx, prefix, vecName, suffix, x, y, color) {
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.font = 'bold 16px sans-serif';
            ctx.lineWidth = 1.5;
            let cx = x;
            if (prefix) {
                ctx.fillText(prefix, cx, y);
                cx += ctx.measureText(prefix).width;
            }
            if (vecName) {
                ctx.fillText(vecName, cx, y);
                let w = ctx.measureText(vecName).width;
                let lineY = y - 14;
                ctx.beginPath();
                ctx.moveTo(cx, lineY);
                ctx.lineTo(cx + w, lineY);
                ctx.moveTo(cx + w - 3, lineY - 3);
                ctx.lineTo(cx + w, lineY);
                ctx.lineTo(cx + w - 3, lineY + 3);
                ctx.stroke();
                cx += w;
            }
            if (suffix) {
                ctx.fillText(suffix, cx, y);
            }
        }

        // Globale Hilfsfunktion für ein vollständiges, einheitliches 3D-Koordinatensystem
        function draw3DSystem(ctx, width, height, origin, boxSize) {
            ctx.strokeStyle = 'rgba(140, 118, 98, 0.3)'; // Leichtes Mocha-600
            ctx.lineWidth = 1;
            
            // Perfekt ausgerichtetes Grid (verhindert Verschiebungen bei dynamischen Breiten)
            const gridStartX = (origin.x % boxSize + boxSize) % boxSize;
            for (let x = gridStartX; x < width; x += boxSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            
            const gridStartY = (origin.y % boxSize + boxSize) % boxSize;
            for (let y = gridStartY; y < height; y += boxSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }

            ctx.strokeStyle = '#a8a29e';
            ctx.fillStyle = '#fdfbf7';
            ctx.lineWidth = 2.5;

            // Pfeil-Zeichner
            const drawArr = (x, y, angle) => {
                ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -6); ctx.lineTo(-12, 6);
                ctx.fillStyle = '#a8a29e'; ctx.fill(); ctx.restore();
            };

            const maxTicks = 7; 

            // x2-Achse (horizontal)
            const startX2 = origin.x - maxTicks * boxSize - 25; 
            const endX2 = origin.x + maxTicks * boxSize + 25;
            ctx.beginPath(); ctx.moveTo(startX2, origin.y); ctx.lineTo(endX2, origin.y); ctx.stroke();
            drawArr(endX2, origin.y, 0);
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('x₂', endX2 + 5, origin.y - 15);

            // x3-Achse (vertikal)
            const startX3 = origin.y + maxTicks * boxSize + 25; 
            const endX3 = origin.y - maxTicks * boxSize - 25;
            ctx.beginPath(); ctx.moveTo(origin.x, startX3); ctx.lineTo(origin.x, endX3); ctx.stroke();
            drawArr(origin.x, endX3, -Math.PI / 2);
            ctx.fillText('x₃', origin.x - 30, endX3 + 15);

            // x1-Achse (diagonal - PROPORTIONAL GEKÜRZT)
            const startX1_x = origin.x + maxTicks * (boxSize / 2) + 25;
            const startX1_y = origin.y - maxTicks * (boxSize / 2) - 25;
            const endX1_x = origin.x - maxTicks * (boxSize / 2) - 25;
            const endX1_y = origin.y + maxTicks * (boxSize / 2) + 25;
            ctx.beginPath(); ctx.moveTo(startX1_x, startX1_y); ctx.lineTo(endX1_x, endX1_y); ctx.stroke();
            drawArr(endX1_x, endX1_y, 3 * Math.PI / 4);
            ctx.fillText('x₁', endX1_x - 25, endX1_y + 15);

            // Achsen-Ticks (Skalierung)
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 1.5;

            for (let i = -maxTicks; i <= maxTicks; i++) {
                if (i === 0) continue;
                
                // x2 Ticks
                let tx2 = origin.x + i * boxSize;
                ctx.beginPath(); ctx.moveTo(tx2, origin.y - 4); ctx.lineTo(tx2, origin.y + 4); ctx.stroke();
                ctx.fillText(i, tx2, origin.y + 18);

                // x3 Ticks
                let ty3 = origin.y - i * boxSize;
                ctx.beginPath(); ctx.moveTo(origin.x - 4, ty3); ctx.lineTo(origin.x + 4, ty3); ctx.stroke();
                ctx.fillText(i, origin.x - 18, ty3);

                // x1 Ticks
                let tx1 = origin.x - i * (boxSize / 2);
                let ty1 = origin.y + i * (boxSize / 2);
                ctx.beginPath(); ctx.moveTo(tx1 - 3, ty1 - 3); ctx.lineTo(tx1 + 3, ty1 + 3); ctx.stroke();
                ctx.fillText(i, tx1, ty1 - 14);
            }
            
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        // Definition der Unterrichtsreihe
        const topics = [
            { id: '3d-koord', title: 'Das 3D-Koordinatensystem' },
            { id: 'abstand', title: 'Abstand zwischen Punkten' },

            { id: 'kollinear', title: 'Kollinearität / Lineare Abhängigkeit' },
            { id: 'gerade-param', title: 'Die Gerade in Parameterform' },
            { id: 'lage-geraden', title: 'Lagebeziehungen zwischen Geraden' },
            { id: 'ebene-param', title: 'Die Ebene in Parameterform' },
            { id: 'gleichungssysteme', title: 'Lineare Gleichungssysteme' },
            { id: 'lage-gerade-ebene', title: 'Lage Gerade und Ebene' },
            { id: 'skalarprodukt', title: 'Das Skalarprodukt' },
            { id: 'winkel-geraden', title: 'Winkel zwischen Geraden' },
            { id: 'winkel-gerade-ebene', title: 'Winkel Gerade und Ebene' },
            { id: 'ebene-normalen', title: 'Ebenen in Normalenform' },
            { id: 'ebene-koordinaten', title: 'Ebenen in Koordinatenform' },
            { id: 'spurpunkte', title: 'Spurpunkte von Ebenen' },
            { id: 'abstandsprobleme', title: 'Abstandsprobleme' } 
        ];

        let activeTopicId = '3d-koord';

        // --- Navigation & UI Logic ---
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = '';
            
            topics.forEach((topic, index) => {
                const btn = document.createElement('button');
                const isActive = topic.id === activeTopicId;
                
                btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-200 flex items-start gap-3 group ${
                    isActive 
                    ? 'bg-gold-500/20 text-gold-400 border border-gold-500/30 shadow-inner' 
                    : 'text-creme-200 hover:bg-mocha-800 hover:text-white border border-transparent'
                }`;
                
                btn.innerHTML = `
                    <span class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                        isActive ? 'bg-gold-500 text-mocha-900 shadow-md' : 'bg-mocha-700 text-creme-300 group-hover:bg-mocha-600'
                    }">${index + 1}</span>
                    <span class="font-medium mt-0.5 leading-tight">${topic.title}</span>
                `;
                
                btn.onclick = () => {
                    activeTopicId = topic.id;
                    renderNav();
                    renderContent();
                };
                
                container.appendChild(btn);
            });
        }

        // --- Topic Rendering Router ---
        function renderContent() {
            const mainDiv = document.getElementById('main-content');
            const topic = topics.find(t => t.id === activeTopicId);

            if (topic.id === '3d-koord') mainDiv.innerHTML = getTopic1HTML();
            else if (topic.id === 'abstand') mainDiv.innerHTML = getTopic2HTML();
            else if (topic.id === 'vektorbegriff') mainDiv.innerHTML = getTopic3HTML();
            else if (topic.id === 'rechnen-vektoren') mainDiv.innerHTML = getTopic4HTML(); 
            else if (topic.id === 'kollinear') mainDiv.innerHTML = getTopic5HTML();
            else if (topic.id === 'gerade-param') mainDiv.innerHTML = getTopic6HTML();
            else if (topic.id === 'lage-geraden') mainDiv.innerHTML = getTopic7HTML();
            else if (topic.id === 'ebene-param') mainDiv.innerHTML = getTopic8HTML();
            else if (topic.id === 'gleichungssysteme') mainDiv.innerHTML = getTopic9HTML();
            else if (topic.id === 'lage-gerade-ebene') mainDiv.innerHTML = getTopic10HTML();
            else if (topic.id === 'skalarprodukt') mainDiv.innerHTML = getTopic11HTML();
            else if (topic.id === 'winkel-geraden') mainDiv.innerHTML = getTopic12HTML();
            else if (topic.id === 'winkel-gerade-ebene') mainDiv.innerHTML = getTopic13HTML();
            else if (topic.id === 'ebene-normalen') mainDiv.innerHTML = getTopic14HTML();
            else if (topic.id === 'ebene-koordinaten') mainDiv.innerHTML = getTopic15HTML();
            else if (topic.id === 'spurpunkte') mainDiv.innerHTML = getTopic16HTML();
            else if (topic.id === 'abstandsprobleme') mainDiv.innerHTML = getTopic17HTML();

            // MathJax Update
            if (typeof MathJax !== 'undefined' && typeof MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise([mainDiv]).catch(err => console.error("MathJax Fehler:", err));
            }

            // Sicherstellen, dass das CSS angewendet wurde, bevor Canvas berechnet wird (Verhindert Strecken!)
            setTimeout(() => {
                if (topic.id === '3d-koord') initCanvas();
                else if (topic.id === 'abstand') { initCanvas2(); initPractice2(); }
                else if (topic.id === 'kollinear') initCanvas3();
                else if (topic.id === 'gerade-param') { initCanvas4(); initCanvas4b(); }
                else if (topic.id === 'ebene-param') initCanvas5();
                else if (topic.id === 'winkel-geraden') initCanvas6();
                else if (topic.id === 'winkel-gerade-ebene') initCanvas7();
                else if (topic.id === 'skalarprodukt') initCanvas8();
                else if (topic.id === 'spurpunkte') initCanvas9();
                else if (topic.id === 'abstandsprobleme') { initCanvas10(); initCanvas11(); initCanvas12(); }
            }, 50);
        }

        // Window-Resize Listener für perfekte Aspect-Ratios
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderContent();
            }, 250);
        });

        // --- HTML Generatoren ---
        function getTopic1HTML() {
            return `
                <div class="max-w-5xl mx-auto animation-fade-in">
                    <div class="mb-8">
                        <span class="text-gold-400 font-bold tracking-wider text-sm uppercase">Thema 1</span>
                        <h2 class="text-3xl md:text-4xl font-extrabold text-creme-100 mt-2">Das 3D-Koordinatensystem</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                        <div class="space-y-6">
                            <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                                <h3 class="text-2xl font-bold text-creme-100 mb-4">Aufbau</h3>
                                <p class="text-lg text-creme-200 mb-4">Um Punkte im Raum darzustellen, erweitern wir das flache x-y-System um eine dritte Dimension. Es besteht aus drei Achsen, die alle senkrecht aufeinander stehen:</p>
                                <ul class="space-y-3 mb-6">
                                    <li class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-400 mr-3"></span><strong class="text-white mr-2">$x_1$-Achse</strong> (zeigt nach vorne/hinten)</li>
                                    <li class="flex items-center"><span class="w-3 h-3 rounded-full bg-green-400 mr-3"></span><strong class="text-white mr-2">$x_2$-Achse</strong> (zeigt nach rechts/links)</li>
                                    <li class="flex items-center"><span class="w-3 h-3 rounded-full bg-blue-400 mr-3"></span><strong class="text-white mr-2">$x_3$-Achse</strong> (zeigt nach oben/unten)</li>
                                </ul>
                                <p class="text-creme-200">Ein Punkt wird als $P(x_1 | x_2 | x_3)$ angegeben. Um ihn einzuzeichnen, geht man vom Ursprung $(0|0|0)$ aus nacheinander die Schritte entlang der Achsen.</p>
                            </div>

                            <div class="bg-amber-900/30 p-6 rounded-2xl border border-amber-500/30">
                                <h4 class="font-bold text-gold-400 mb-2 flex items-center">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Zeichen-Tipp fürs Heft
                                </h4>
                                <p class="text-sm text-creme-200">Auf Kästchenpapier zeichnet man die $x_2$- und $x_3$-Achse normal im 90° Winkel. Die $x_1$-Achse zeichnet man diagonal im 45° Winkel (durch die Kästchendiagonalen). <strong class="text-white">Wichtig:</strong> Eine Längeneinheit auf der $x_1$-Achse entspricht genau einer Kästchendiagonale (Verkürzung zur räumlichen Darstellung).</p>
                            </div>
                        </div>

                        <div class="bg-mocha-800 border border-mocha-600 rounded-2xl p-4 shadow-lg flex flex-col items-center">
                            <h3 class="w-full text-center font-bold text-creme-200 mb-2">Interaktives Konstruieren</h3>
                            <p class="text-sm text-creme-300 text-center mb-4">Schrittweise Konstruktion des Punktes P(3 | 4 | 5)</p>
                            
                            <div class="relative bg-mocha-900 rounded-xl overflow-hidden border border-mocha-600 w-full aspect-[4/3] shadow-inner">
                                <canvas id="coordCanvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                            </div>
                            
                            <div class="mt-4 flex items-center gap-3 w-full">
                                <button id="btnPrev" class="flex-1 py-2 bg-mocha-700 border border-mocha-600 hover:bg-mocha-600 text-creme-200 rounded-lg font-medium transition-colors disabled:opacity-30 disabled:cursor-not-allowed">Zurück</button>
                                <div class="font-bold text-gold-400 w-24 text-center" id="stepIndicator">Schritt 0/4</div>
                                <button id="btnNext" class="flex-1 py-2 bg-[#8b6b4a] hover:bg-[#a3805b] text-white rounded-lg font-medium transition-colors disabled:opacity-30 disabled:cursor-not-allowed">Nächster</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getTopic2HTML() {
            return `
                <div class="max-w-5xl mx-auto animation-fade-in">
                    <div class="mb-8">
                        <span class="text-gold-400 font-bold tracking-wider text-sm uppercase">Thema 2</span>
                        <h2 class="text-3xl md:text-4xl font-extrabold text-creme-100 mt-2">Abstand zwischen Punkten</h2>
                    </div>

                    <div class="flex flex-col lg:flex-row gap-8 items-stretch mb-8">
                        <div class="flex-1 bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600 flex flex-col justify-center">
                            <h3 class="text-2xl font-bold text-creme-100 mb-4">Der 3D Pythagoras</h3>
                            <p class="text-lg text-creme-200 mb-4">Den Abstand zweier Punkte $A(a_1|a_2|a_3)$ und $B(b_1|b_2|b_3)$ berechnet man mit einer einfachen Erweiterung des Satzes des Pythagoras auf drei Dimensionen.</p>
                            <div class="bg-amber-900/30 border-l-4 border-amber-500 p-5 rounded-r-xl my-6">
                                <div class="text-xl md:text-2xl font-bold text-center text-gold-300 math-box">
                                    $$d(A,B) = \\sqrt{(b_1 - a_1)^2 + (b_2 - a_2)^2 + (b_3 - a_3)^2}$$
                                </div>
                            </div>
                            <p class="text-creme-200">Man berechnet die Differenz der jeweiligen Koordinaten, quadriert diese, addiert alles und zieht am Ende die Wurzel.</p>
                        </div>
                        
                        <div class="w-full lg:w-1/2 bg-mocha-900 p-4 rounded-2xl border border-mocha-600 shadow-lg flex flex-col justify-center items-center min-h-[350px]">
                            <div class="relative w-full aspect-[4/3]">
                                <canvas id="distanceCanvas" class="absolute top-0 left-0 w-full h-full rounded-xl"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Practice Section -->
                    <div class="bg-mocha-800 p-6 md:p-8 rounded-2xl shadow-lg border border-mocha-600">
                        <h3 class="text-xl font-bold text-creme-100 mb-4 flex items-center">
                            <svg class="w-6 h-6 mr-2 text-gold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                            Interaktiver Rechner
                        </h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-4">
                                <div class="flex items-center gap-4 bg-mocha-900 p-3 rounded-lg border border-mocha-600">
                                    <span class="font-bold text-creme-100 w-8">A = (</span>
                                    <input type="number" id="a1" value="1" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400"> <span class="text-mocha-500">|</span>
                                    <input type="number" id="a2" value="2" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400"> <span class="text-mocha-500">|</span>
                                    <input type="number" id="a3" value="3" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400">
                                    <span class="font-bold text-creme-100">)</span>
                                </div>
                                <div class="flex items-center gap-4 bg-mocha-900 p-3 rounded-lg border border-mocha-600">
                                    <span class="font-bold text-creme-100 w-8">B = (</span>
                                    <input type="number" id="b1" value="5" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400"> <span class="text-mocha-500">|</span>
                                    <input type="number" id="b2" value="5" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400"> <span class="text-mocha-500">|</span>
                                    <input type="number" id="b3" value="3" class="w-16 bg-mocha-700 border border-mocha-500 rounded p-1 text-center text-white focus:outline-none focus:border-gold-400">
                                    <span class="font-bold text-creme-100">)</span>
                                </div>
                                <button id="calcDistBtn" class="w-full py-3 bg-[#8b6b4a] hover:bg-[#a3805b] text-white rounded-lg font-bold transition-colors shadow-md">Abstand berechnen</button>
                            </div>
                            
                            <div class="bg-mocha-900 rounded-xl border border-mocha-600 p-5 flex flex-col justify-center min-h-[160px]" id="distResult">
                                <p class="text-mocha-400 text-center italic">Gib Koordinaten ein und klicke auf Berechnen.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function getTopic3HTML() {
            return `
                <div class="max-w-5xl mx-auto animation-fade-in">

                            <div class="bg-mocha-900 p-5 rounded-xl border-l-4 border-amber-500 mb-6 shadow-inner">
                                <strong class="text-white block mb-2 text-lg">Die Kernidee: Skalarprodukt als Projektion</strong>
                                <p class="text-sm text-creme-200">Der Abstand lässt sich auch extrem elegant direkt über das Skalarprodukt berechnen: Man nimmt den Verbindungsvektor von einem beliebigen Punkt der Ebene (dem Aufpunkt $A$) zum Punkt $P$. Diesen multipliziert man skalar mit dem <strong class="text-white">normierten Normalenvektor $\\vec{n}_0$</strong>.</p>
                                <p class="text-sm text-creme-200 mt-2">Warum? Das Skalarprodukt misst exakt, wie weit dieser Verbindungsvektor in die senkrechte Richtung der Ebene zeigt. Damit der berechnete Wert direkt der wahren Distanz entspricht und nicht durch die Länge des Normalenvektors verzerrt wird, <em>muss</em> der Normalenvektor vorher auf die Länge 1 gestaucht werden (normiert werden).</p>

                                    <div class="text-center text-gold-300 font-bold math-box text-lg">

                                    <div class="text-center text-gold-300 font-bold math-box text-lg">
                                        $$d = \\frac{|n_1 p_1 + n_2 p_2 + n_3 p_3 - c|}{\\sqrt{n_1^2 + n_2^2 + n_3^2}}$$
                                    </div>

                                <p class="text-sm text-creme-200">Gegeben ist die Ebene $E: \\left( \\vec{x} - \\begin{pmatrix} 1 \\\\ 0 \\\\ 2 \\end{pmatrix} \\right) \\cdot \\begin{pmatrix} 2 \\\\ 2 \\\\ -1 \\end{pmatrix} = 0$ und der Punkt $P(5 | 2 | 4)$.</p>

                                        Länge berechnen: $|\\vec{n}| = \\sqrt{2^2 + 2^2 + (-1)^2} = \\sqrt{4+4+1} = \\sqrt{9} = 3$<br>
                                        Normierter Vektor: $\\vec{n}_0 = \\frac{1}{3} \\begin{pmatrix} 2 \\\\ 2 \\\\ -1 \\end{pmatrix}$
                                    </div>

                                        <div class="text-center font-bold text-gold-300 math-box mt-2 bg-mocha-800 p-3 rounded">
                                            $$d = \\left| \\left( \\begin{pmatrix} 5 \\\\ 2 \\\\ 4 \\end{pmatrix} - \\begin{pmatrix} 1 \\\\ 0 \\\\ 2 \\end{pmatrix} \\right) \\cdot \\frac{1}{3} \\begin{pmatrix} 2 \\\\ 2 \\\\ -1 \\end{pmatrix} \\right|$$

        // --- Canvas Logiken ---
        
        // HILFSFUNKTION: Extrahiert die wahren CSS-Dimensionen, um Verzerrungen zu vermeiden.
        function getRealCanvasSize(canvas) {
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return null;
            return { w: rect.width, h: rect.height };
        }

        function initCanvas() {
            const canvas = document.getElementById('coordCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
            const ctx = canvas.getContext('2d');
            
            const displayWidth = size.w;
            const displayHeight = size.h;
            
            canvas.width = displayWidth * window.devicePixelRatio;
            canvas.height = displayHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const boxSize = 40; 
            const origin = { x: displayWidth / 2 - 20, y: displayHeight / 2 + 40 }; 
            
            let currentStep = 0;
            const totalSteps = 4;
            const p = { x1: 3, x2: 4, x3: 5 }; 

            function project(x1, x2, x3) {
                return {
                    x: origin.x - x1 * (boxSize / 2) + x2 * boxSize,
                    y: origin.y + x1 * (boxSize / 2) - x3 * boxSize
                };
            }

            function draw() {
                ctx.clearRect(0, 0, displayWidth, displayHeight);
                draw3DSystem(ctx, displayWidth, displayHeight, origin, boxSize);

                if (currentStep >= 1) { 
                    const p1 = project(p.x1, 0, 0);
                    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
                }
                if (currentStep >= 2) { 
                    const p1 = project(p.x1, 0, 0);
                    const p2 = project(p.x1, p.x2, 0);
                    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                }
                if (currentStep >= 3) { 
                    const p2 = project(p.x1, p.x2, 0);
                    const p3 = project(p.x1, p.x2, p.x3);
                    ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.stroke();
                }
                if (currentStep >= 4) { 
                    const p3 = project(p.x1, p.x2, p.x3);
                    ctx.beginPath();
                    ctx.arc(p3.x, p3.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#fbbf24'; ctx.fill();
                    ctx.fillStyle = '#fdfbf7'; ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('P(3|4|5)', p3.x + 10, p3.y - 10);
                }
            }

            draw();

            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const stepIndicator = document.getElementById('stepIndicator');

            if(!btnPrev || !btnNext || !stepIndicator) return;

            btnPrev.onclick = () => {
                if (currentStep > 0) {
                    currentStep--;
                    stepIndicator.innerText = `Schritt ${currentStep}/${totalSteps}`;
                    btnPrev.disabled = currentStep === 0;
                    btnNext.disabled = false;
                    draw();
                }
            };

            btnNext.onclick = () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    stepIndicator.innerText = `Schritt ${currentStep}/${totalSteps}`;
                    btnPrev.disabled = false;
                    btnNext.disabled = currentStep === totalSteps;
                    draw();
                }
            };
        }

        function initCanvas2() {
            const canvas = document.getElementById('distanceCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
            const ctx = canvas.getContext('2d');
            
            const displayWidth = size.w;
            const displayHeight = size.h;
            
            canvas.width = displayWidth * window.devicePixelRatio;
            canvas.height = displayHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.clearRect(0, 0, displayWidth, displayHeight);

            const cx = displayWidth / 2;
            const cy = displayHeight / 2;

            const boxWidth = 200;  
            const boxDepth = 90;   
            const boxHeight = 160; 

            const A = {x: cx - boxWidth/2 - boxDepth/2, y: cy + boxHeight/2 + boxDepth/2};
            const C = {x: A.x + boxWidth, y: A.y};
            const Bprime = {x: C.x + boxDepth, y: C.y - boxDepth};
            const B = {x: Bprime.x, y: Bprime.y - boxHeight};

            const D = {x: A.x + boxDepth, y: A.y - boxDepth};
            const E = {x: A.x, y: A.y - boxHeight};
            const F = {x: C.x, y: C.y - boxHeight};
            const G = {x: D.x, y: D.y - boxHeight};

            ctx.strokeStyle = 'rgba(140, 118, 98, 0.5)'; 
            ctx.lineWidth = 2;
            ctx.strokeRect(A.x, E.y, C.x - A.x, A.y - E.y); 
            ctx.strokeRect(D.x, G.y, Bprime.x - D.x, Bprime.y - G.y); 
            ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(D.x, D.y); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(C.x, C.y); ctx.lineTo(Bprime.x, Bprime.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(F.x, F.y); ctx.lineTo(B.x, B.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(E.x, E.y); ctx.lineTo(G.x, G.y); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y); ctx.lineTo(Bprime.x, Bprime.y); ctx.closePath();
            ctx.fillStyle = 'rgba(74, 222, 128, 0.15)'; ctx.fill();
            ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 3; ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(A.x, A.y); ctx.lineTo(Bprime.x, Bprime.y); ctx.lineTo(B.x, B.y); ctx.closePath();
            ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; ctx.fill();
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
            ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 5; ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(C.x - 18, C.y); ctx.lineTo(C.x - 18 + 12, C.y - 12); ctx.lineTo(C.x + 12, C.y - 12);
            ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(Bprime.x, Bprime.y - 18); ctx.lineTo(Bprime.x - 15, Bprime.y - 18 + 5); ctx.lineTo(Bprime.x - 15, Bprime.y + 5);
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.stroke();

            ctx.beginPath(); ctx.arc(A.x, A.y, 7, 0, Math.PI*2); ctx.fillStyle = '#f87171'; ctx.fill();
            ctx.beginPath(); ctx.arc(B.x, B.y, 7, 0, Math.PI*2); ctx.fillStyle = '#f87171'; ctx.fill();

            ctx.fillStyle = '#fdfbf7'; ctx.font = 'bold 22px sans-serif';
            ctx.fillText('A', A.x - 25, A.y + 20);
            ctx.fillText('B', B.x + 15, B.y - 5);
            
            ctx.font = '18px sans-serif'; ctx.fillStyle = '#4ade80'; 
            ctx.fillText('Δx₂', C.x + 20, C.y - 10);
            ctx.fillText('Δx₁', A.x + 60, A.y + 30);
            
            ctx.fillStyle = '#fbbf24'; 
            ctx.fillText('Δx₃', B.x + 15, (B.y + Bprime.y) / 2 + 5);
            
            ctx.fillStyle = '#f43f5e'; ctx.font = 'bold 24px sans-serif';
            ctx.fillText('d', (A.x + B.x) / 2 - 20, (A.y + B.y) / 2 - 15);
        }

        function initPractice2() {
            const btn = document.getElementById('calcDistBtn');
            if(!btn) return;
            btn.onclick = () => {
                const a1 = parseFloat(document.getElementById('a1').value) || 0;
                const a2 = parseFloat(document.getElementById('a2').value) || 0;
                const a3 = parseFloat(document.getElementById('a3').value) || 0;
                const b1 = parseFloat(document.getElementById('b1').value) || 0;
                const b2 = parseFloat(document.getElementById('b2').value) || 0;
                const b3 = parseFloat(document.getElementById('b3').value) || 0;
                
                const diff1 = b1 - a1;
                const diff2 = b2 - a2;
                const diff3 = b3 - a3;
                
                const distSq = diff1*diff1 + diff2*diff2 + diff3*diff3;
                const dist = Math.sqrt(distSq);
                
                const resDiv = document.getElementById('distResult');
                resDiv.innerHTML = `
                    <div class="text-sm text-creme-200 mb-2">
                        d = &radic;<span class="text-mocha-300">((${b1}) - (${a1}))&sup2; + (${b2} - ${a2})&sup2; + (${b3} - ${a3})&sup2;</span>
                    </div>
                    <div class="text-sm text-creme-200 mb-2">
                        d = &radic;<span class="text-mocha-300">(${diff1})&sup2; + (${diff2})&sup2; + (${diff3})&sup2;</span>
                    </div>
                    <div class="text-sm text-creme-200 mb-3">
                        d = &radic;<span class="text-mocha-300">${diff1*diff1} + ${diff2*diff2} + ${diff3*diff3}</span>
                    </div>
                    <div class="text-2xl font-bold text-gold-400 border-t border-mocha-600 pt-2">
                        d = &radic;${distSq} &approx; ${dist.toFixed(2)}
                    </div>
                `;
            };
        }

        function initCanvas3() {
            const canvas = document.getElementById('collinearCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
            const ctx = canvas.getContext('2d');
            
            const width = size.w;
            const height = size.h;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const boxSize = 40;
            const origin = { x: width / 2, y: height / 2 + 50 };
            
            let currentStep = 1;
            const totalSteps = 3;

            function project(x1, x2, x3) {
                return {
                    x: origin.x - x1 * (boxSize / 2) + x2 * boxSize,
                    y: origin.y + x1 * (boxSize / 2) - x3 * boxSize
                };
            }

            const a = { x1: 4, x2: 2, x3: 1 };
            const b = { x1: -1, x2: 3, x3: 2 };
            const c = { x1: 0.8*a.x1 + 0.8*b.x1, x2: 0.8*a.x2 + 0.8*b.x2, x3: 0.8*a.x3 + 0.8*b.x3 };

            function drawVec(v, color, prefix, vecName, offsetX, offsetY) {
                const p = project(v.x1, v.x2, v.x3);
                ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 4;
                ctx.moveTo(origin.x, origin.y); ctx.lineTo(p.x, p.y); ctx.stroke();
                
                const angle = Math.atan2(p.y - origin.y, p.x - origin.x);
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(angle);
                ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-12, -6); ctx.lineTo(-12, 6); ctx.closePath();
                ctx.fillStyle = color; ctx.fill(); ctx.restore();

                drawVecLabel(ctx, prefix, vecName, '', p.x + offsetX, p.y + offsetY, color);
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                ctx.strokeStyle = '#524336'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, origin.y); ctx.lineTo(width, origin.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(origin.x, height); ctx.lineTo(origin.x, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(origin.x + 6*20, origin.y - 6*20); ctx.lineTo(origin.x - 6*20, origin.y + 6*20); ctx.stroke();

                if (currentStep >= 2) {
                    const p1 = project(0, 0, 0);
                    const p2 = project(a.x1, a.x2, a.x3);

            ctx.beginPath(); ctx.moveTo(projX, origin.y + vecB.y); ctx.lineTo(projX, origin.y);

            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(origin.x + vecA.x, origin.y);
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.stroke();

            drawVecLabel(ctx, '', 'a', '', origin.x + vecA.x - 15, origin.y - 15, '#fde68a');

            ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(origin.x + vecB.x, origin.y + vecB.y);

            drawVecLabel(ctx, '', 'b', '', origin.x + vecB.x / 2 - 25, origin.y + vecB.y / 2 - 15, '#86efac');

        function initCanvas9() {
            const canvas = document.getElementById('tracePointsCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
            const ctx = canvas.getContext('2d');
            
            const displayWidth = size.w;
            const displayHeight = size.h;
            canvas.width = displayWidth * window.devicePixelRatio;
            canvas.height = displayHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const boxSize = 40; 
            const origin = { x: displayWidth / 2 - 20, y: displayHeight / 2 + 120 }; 

            let currentStep = 0;
            const totalSteps = 4;

            function project(x1, x2, x3) {
                return {
                    x: origin.x - x1 * (boxSize / 2) + x2 * boxSize,
                    y: origin.y + x1 * (boxSize / 2) - x3 * boxSize
                };
            }

            const s1 = project(3, 0, 0);
            const s2 = project(0, 2, 0);
            const s3 = project(0, 0, 6);

            function draw() {
                ctx.clearRect(0, 0, displayWidth, displayHeight);
                draw3DSystem(ctx, displayWidth, displayHeight, origin, boxSize);

                if (currentStep >= 4) {
                    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y); ctx.closePath();
                    ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; ctx.fill();
                    
                    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s3.x, s3.y); ctx.stroke();
                }

                if (currentStep >= 1) {
                    ctx.beginPath(); ctx.arc(s1.x, s1.y, 6, 0, 2*Math.PI); ctx.fillStyle = '#60a5fa'; ctx.fill();
                    ctx.strokeStyle = '#fdfbf7'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#fdfbf7'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('S₁', s1.x - 30, s1.y + 5);
                }

                if (currentStep >= 2) {
                    ctx.beginPath(); ctx.arc(s2.x, s2.y, 6, 0, 2*Math.PI); ctx.fillStyle = '#4ade80'; ctx.fill();
                    ctx.strokeStyle = '#fdfbf7'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#fdfbf7'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('S₂', s2.x + 10, s2.y - 10);
                }

                if (currentStep >= 3) {
                    ctx.beginPath(); ctx.arc(s3.x, s3.y, 6, 0, 2*Math.PI); ctx.fillStyle = '#f87171'; ctx.fill();
                    ctx.strokeStyle = '#fdfbf7'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#fdfbf7'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('S₃', s3.x + 15, s3.y + 5);
                }
            }

            draw();

            const btnPrev = document.getElementById('btnPrev9');
            const btnNext = document.getElementById('btnNext9');
            const stepIndicator = document.getElementById('stepIndicator9');
            if(!btnPrev || !btnNext || !stepIndicator) return;

            function updateUI() {
                btnPrev.disabled = currentStep === 0;
                btnNext.disabled = currentStep === totalSteps;
                stepIndicator.innerText = `Schritt ${currentStep}/${totalSteps}`;
                draw();

                document.querySelectorAll('.step-card9').forEach(el => {
                    const step = parseInt(el.getAttribute('data-step'));
                    if (step === currentStep) {
                        el.classList.remove('opacity-40');
                        el.classList.add('opacity-100', 'border-l-4', 'shadow-md');
                        if(step===1) el.classList.add('border-blue-500');
                        if(step===2) el.classList.add('border-green-500');
                        if(step===3) el.classList.add('border-red-500');
                        if(step===4) el.classList.add('border-white');
                    } else if (step < currentStep) {
                        el.classList.remove('opacity-40', 'shadow-md');
                        el.classList.add('opacity-100');
                        el.className = el.className.replace(/border-(blue|green|red|white)-\d+/, 'border-mocha-600');
                    } else {
                        el.classList.add('opacity-40');
                        el.classList.remove('opacity-100', 'shadow-md');
                        el.className = el.className.replace(/border-(blue|green|red|white)-\d+/, 'border-mocha-600');
                    }
                });
            }

            btnPrev.onclick = () => { if (currentStep > 0) { currentStep--; updateUI(); } };
            btnNext.onclick = () => { if (currentStep < totalSteps) { currentStep++; updateUI(); } };
            updateUI(); 
        }

        function initCanvas10() {
            const canvas = document.getElementById('distPlaneCanvas');
            const size = getRealCanvasSize(canvas);
            if (!size) return;
            const ctx = canvas.getContext('2d');
            const displayWidth = size.w;
            const displayHeight = size.h;
            canvas.width = displayWidth * window.devicePixelRatio;
            canvas.height = displayHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            const cx = displayWidth / 2;
            const cy = displayHeight / 2 + 40;
            ctx.clearRect(0, 0, displayWidth, displayHeight);

            // Ebene E (schematisches Parallelogramm)
            ctx.beginPath();
            ctx.moveTo(cx - 140, cy + 50); 
            ctx.lineTo(cx + 80, cy + 50);
            ctx.lineTo(cx + 140, cy - 30); 
            ctx.lineTo(cx - 80, cy - 30);
            ctx.closePath();
            ctx.fillStyle = 'rgba(251, 191, 36, 0.15)'; 
            ctx.fill();
            ctx.strokeStyle = '#fbbf24'; 
            ctx.lineWidth = 2; 
            ctx.stroke();
            ctx.fillStyle = '#fde68a'; 
            ctx.font = 'bold 22px sans-serif'; 
            ctx.fillText('E', cx - 110, cy + 30);

            // Punkte P und F
            const pX = cx + 20; 
            const pY = cy - 140; // P liegt im Raum darüber
            const fX = cx + 20; 
            const fY = cy;       // F exakt senkrecht darunter auf der Ebene

            // Lotgerade (unter der Ebene gestrichelt andeuten)
            ctx.beginPath(); 
            ctx.strokeStyle = '#a8a29e'; 
            ctx.lineWidth = 2; 
            ctx.setLineDash([5, 5]);
            ctx.moveTo(fX, fY); 
            ctx.lineTo(fX, fY + 60); 
            ctx.stroke(); 
            ctx.setLineDash([]);
            
            // Abstandsvektor PF (rote Linie)
            ctx.beginPath(); 
            ctx.strokeStyle = '#f43f5e'; 
            ctx.lineWidth = 3; 
            ctx.moveTo(pX, pY); 
            ctx.lineTo(fX, fY); 
            ctx.stroke();
            
            // Verlängerung der Hilfsgeraden h nach oben
            ctx.beginPath(); 
            ctx.strokeStyle = '#a8a29e'; 
            ctx.lineWidth = 2;
            ctx.moveTo(pX, pY);
            ctx.lineTo(pX, pY - 30);
            ctx.stroke();
            
            // Label der Geraden h
            ctx.fillStyle = '#a8a29e'; 
            ctx.font = 'italic 18px sans-serif'; 
            ctx.fillText('h', pX + 10, pY - 20);

            // Normalenvektor der Ebene (zur klaren Veranschaulichung links platziert)
            const nX = cx - 40;
            const nY = cy;
            ctx.beginPath(); 
            ctx.strokeStyle = '#4ade80'; 
            ctx.lineWidth = 3;
            ctx.moveTo(nX, nY); 
            ctx.lineTo(nX, nY - 70); 
            ctx.stroke();
            
            // Pfeilspitze des Normalenvektors
            ctx.beginPath(); 
            ctx.moveTo(nX, nY - 70); 
            ctx.lineTo(nX - 6, nY - 60); 
            ctx.lineTo(nX + 6, nY - 60); 
            ctx.fillStyle = '#4ade80'; 
            ctx.fill();
            drawVecLabel(ctx, '', 'n', '', nX - 25, nY - 35, '#86efac');
            
            // Rechter Winkel für den Normalenvektor
            ctx.beginPath(); 
            ctx.strokeStyle = '#fdfbf7'; 
            ctx.lineWidth = 1.5;
            ctx.moveTo(nX, nY - 15); 
            ctx.lineTo(nX + 15, nY - 15); 
            ctx.lineTo(nX + 15, nY); 
            ctx.stroke();
            ctx.beginPath(); 
            ctx.arc(nX + 7, nY - 7, 2, 0, Math.PI*2); 
            ctx.fillStyle = '#fdfbf7'; 
            ctx.fill();

            // Rechter Winkel für die Lotgerade im Durchstoßpunkt F
            ctx.beginPath(); 
            ctx.strokeStyle = '#fdfbf7'; 
            ctx.lineWidth = 1.5;
            ctx.moveTo(fX, fY - 15); 
            ctx.lineTo(fX + 15, fY - 15); 
            ctx.lineTo(fX + 15, fY); 
            ctx.stroke();
            ctx.beginPath(); 
            ctx.arc(fX + 7, fY - 7, 2, 0, Math.PI*2); 
            ctx.fillStyle = '#fdfbf7'; 
            ctx.fill();

            // Punkt P zeichnen
            ctx.beginPath(); 
            ctx.arc(pX, pY, 6, 0, Math.PI*2); 
            ctx.fillStyle = '#f43f5e'; 
            ctx.fill();
            ctx.fillStyle = '#fff'; 
            ctx.font = 'bold 18px sans-serif'; 
            ctx.fillText('P', pX - 25, pY + 5);

            // Punkt F (Durchstoßpunkt) zeichnen
            ctx.beginPath(); 
            ctx.arc(fX, fY, 6, 0, Math.PI*2); 
            ctx.fillStyle = '#60a5fa'; 
            ctx.fill();
            ctx.fillStyle = '#fff'; 
            ctx.fillText('F', fX - 25, fY + 20);
            
            // Abstands-Label
            ctx.fillStyle = '#fbbf24'; 
            ctx.font = 'bold 20px sans-serif'; 
            ctx.fillText('d = |PF|', pX + 15, (pY + fY)/2 + 5);
        }
